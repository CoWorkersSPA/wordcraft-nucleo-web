# Construye el núcleo web de WordCraft y, con una etiqueta v<versión>-<n>, lo publica como release (tar.gz + SHA-256).
# Quien lo consume (bff: apps/wordcraft/nucleo.json) fija la versión y la suma SHA-256 de esa release.
name: Núcleo web

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: nucleo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  construir:
    runs-on: self-hosted
    timeout-minutes: 40
    permissions:
      contents: write # solo lo usa el paso de publicar, con etiqueta
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # Rust (con wasm32-unknown-unknown), un compilador de C/C++ y gh vienen instalados en el runner propio, y las herramientas
      # de cargo (wasm-bindgen, wasm-opt, wasm-split-cli) quedan en ~/.cargo/bin tras la primera corrida de construir.sh.
      - name: Versión
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - run: scripts/construir.sh "${{ steps.version.outputs.version }}"
      - name: Prueba de humo del paquete
        run: node scripts/probar.mjs "trabajo/wordcraft-nucleo-web-${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-nucleo-web-${{ steps.version.outputs.version }}
          path: salida/
          retention-days: 14
      - name: Publicar la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Con curl y la API de GitHub (el runner propio no tiene gh); node viene de setup-node.
        run: |
          sum="$(cut -d' ' -f1 salida/*.tar.gz.sha256)"
          cuerpo="$(node -e 'console.log(JSON.stringify({ tag_name: process.argv[1], name: "Núcleo web " + process.argv[1].slice(1), body: "SHA-256 del paquete: `" + process.argv[2] + "`. Para usarlo en bff, fijar esta versión y esta suma en apps/wordcraft/nucleo.json." }))' "$GITHUB_REF_NAME" "$sum")"
          id="$(curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" -d "$cuerpo" \
            | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => console.log(JSON.parse(s).id))')"
          for f in salida/*.tar.gz salida/*.tar.gz.sha256; do
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$(basename "$f")" > /dev/null
          done
