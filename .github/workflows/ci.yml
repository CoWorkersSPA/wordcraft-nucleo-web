# Construye el núcleo web de WordCraft y, con una etiqueta v<versión>-<n>, lo publica como release (tar.gz + SHA-256).
# Quien lo consume (bff: apps/wordcraft/nucleo.json) fija la versión y la suma SHA-256 de esa release.
name: Núcleo web

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: nucleo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # solo lo usa el paso de publicar, con etiqueta
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # wasm-bindgen-cli, wasm-opt y wasm-split-cli tardan en compilarse: se guardan entre ejecuciones.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-opt
            ~/.cargo/bin/wasm-split-cli
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry
            ~/.cargo/git
          key: nucleo-herramientas-${{ runner.os }}-${{ hashFiles('UPSTREAM', 'scripts/construir.sh') }}
      - name: Versión
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - run: scripts/construir.sh "${{ steps.version.outputs.version }}"
      - name: Prueba de humo del paquete
        run: node scripts/probar.mjs "trabajo/wordcraft-nucleo-web-${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-nucleo-web-${{ steps.version.outputs.version }}
          path: salida/
          retention-days: 14
      - name: Publicar la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sum="$(cut -d' ' -f1 salida/*.tar.gz.sha256)"
          gh release create "$GITHUB_REF_NAME" salida/*.tar.gz salida/*.tar.gz.sha256 \
            --title "Núcleo web ${GITHUB_REF_NAME#v}" \
            --notes "SHA-256 del paquete: \`$sum\`. Para usarlo en bff, fijar esta versión y esta suma en apps/wordcraft/nucleo.json."
